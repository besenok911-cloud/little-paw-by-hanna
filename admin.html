<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>CRM · Little Paw</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#f4ecdf;--surface:#fff;--sand:#efe1cd;--ink:#3a2a1e;--ink-soft:#6e5844;--muted:#93795f;
  --line:#e5d5bd;--accent:#c25e38;--accent-ink:#a44c2b;--accent-soft:#f3dbcc;--gold:#be8c33;
  --ok:#2f8f5b;--shadow:0 14px 34px -24px rgba(58,42,30,.5);
  --fh:"Comfortaa",system-ui,sans-serif;--fb:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#1c1510;--surface:#271e17;--sand:#31261e;--ink:#f1e6d7;--ink-soft:#cab699;--muted:#a08b76;
  --line:#3c3025;--accent:#dd8659;--accent-ink:#e9a17c;--accent-soft:#38281e;--gold:#ddb061;
  --ok:#5fbf8a;--shadow:0 18px 40px -26px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);line-height:1.5}
a{color:var(--accent-ink)}
.wrap{width:min(100% - 32px,1100px);margin:0 auto;padding:24px 0 64px}
h1,h2,h3{font-family:var(--fh);margin:0;line-height:1.2}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.top .brand{display:flex;align-items:center;gap:10px;font-family:var(--fh);font-weight:700;color:var(--accent-ink)}
.top .brand img{height:34px;width:auto}
.top .sp{margin-left:auto}
.btn{font-family:var(--fh);font-weight:600;border:0;border-radius:10px;padding:.6em 1.1em;cursor:pointer;
  background:var(--accent);color:#fff;transition:.15s;font-size:.95rem}
.btn:hover{background:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1.5px solid var(--accent)}

/* login */
.login{max-width:360px;margin:8vh auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:32px 28px;box-shadow:var(--shadow);text-align:center}
.login img{height:52px;margin-bottom:12px}
.login h1{font-size:1.3rem;color:var(--ink);margin-bottom:6px}
.login p{color:var(--muted);font-size:.9rem;margin:0 0 18px}
.login input{width:100%;padding:.72em .9em;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);
  color:var(--ink);font-family:var(--fb);font-size:1rem;margin-bottom:12px}
.login input:focus{outline:none;border-color:var(--accent)}
.err{color:#c0472b;font-weight:700;min-height:1.2em;font-size:.9rem}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.kpi .v{font-family:var(--fh);font-weight:700;font-size:1.9rem;color:var(--accent-ink);line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:.82rem;margin-top:8px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}

/* panels */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);min-width:0}
.panel h2{font-size:1.05rem;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel h2 .c{color:var(--muted);font-weight:400;font-size:.85rem;font-family:var(--fb)}

/* bars */
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.bar .bn{color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bt{background:var(--sand);border-radius:6px;overflow:hidden;height:16px}
.bar .bt i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:6px}
.bar .bv{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;min-width:28px;text-align:right}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
thead th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;position:sticky;top:0;background:var(--surface)}
tbody tr:hover{background:var(--paper)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.search{width:100%;max-width:280px;padding:.55em .8em;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-family:var(--fb);margin-bottom:12px}
.search:focus{outline:none;border-color:var(--accent)}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent-ink);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px}
.empty{color:var(--muted);text-align:center;padding:30px}
.muted{color:var(--muted);font-size:.85rem}
@media (max-width:720px){.grid{grid-template-columns:1fr}.bar{grid-template-columns:96px 1fr auto}}
</style>
</head>
<body>

<!-- Login gate -->
<div id="login" class="login">
  <img src="assets/brand/logo.webp?v=2" alt="Little Paw" />
  <h1>CRM · Little Paw</h1>
  <p>Панель обліку записів і клієнтів</p>
  <input id="key" type="password" placeholder="Пароль" autocomplete="current-password" />
  <button class="btn" id="enter" style="width:100%">Увійти</button>
  <p class="err" id="loginErr"></p>
</div>

<!-- Dashboard -->
<div id="dash" class="wrap" hidden>
  <div class="top">
    <span class="brand"><img src="assets/brand/logo.webp?v=2" alt="" /> CRM</span>
    <span class="sp"></span>
    <button class="btn ghost" id="refresh">Оновити</button>
    <button class="btn ghost" id="logout">Вийти</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="panel"><h2>Записи по місяцях</h2><div class="bars" id="byMonth"></div></div>
    <div class="panel"><h2>Завантаженість по днях тижня</h2><div class="bars" id="byDow"></div></div>
  </div>
  <div class="grid">
    <div class="panel"><h2>Топ послуг</h2><div class="bars" id="byService"></div></div>
    <div class="panel"><h2>Топ порід</h2><div class="bars" id="byBreed"></div></div>
  </div>

  <div class="panel" style="margin-bottom:16px">
    <h2>Клієнти <span class="c" id="clientsCount"></span></h2>
    <input class="search" id="clientSearch" placeholder="Пошук за ім'ям або телефоном…" />
    <div class="tbl-wrap"><table id="clientsTbl">
      <thead><tr><th>Клієнт</th><th>Телефон</th><th class="num">Візитів</th><th>Останній</th><th>Послуги</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </div>

  <div class="panel">
    <h2>Останні записи</h2>
    <div class="tbl-wrap"><table id="recentTbl">
      <thead><tr><th>Створено</th><th>Дата візиту</th><th>Клієнт</th><th>Телефон</th><th>Послуга / порода</th><th>Час</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </div>
</div>

<script>
(function(){
  var WORKER = "https://littlepaw-booking.besenok911.workers.dev";
  var $ = function(s){return document.querySelector(s)};
  var loginEl=$("#login"), dashEl=$("#dash"), keyInput=$("#key"), errEl=$("#loginErr");
  var KEYNAME="lp_crm_key";
  var bookings=[];

  function fmtInt(n){return (n||0).toLocaleString("uk-UA")}
  function phoneKey(p){return String(p||"").replace(/\D/g,"").slice(-10)}
  function monthKey(d){return (d||"").slice(0,7)}
  var DOW=["Нд","Пн","Вт","Ср","Чт","Пт","Сб"];
  var MONTHS=["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];

  async function load(key){
    errEl.textContent="";
    try{
      var r=await fetch(WORKER+"/admin?key="+encodeURIComponent(key));
      if(r.status===401){errEl.textContent="Невірний пароль";return false;}
      var d=await r.json();
      if(!d.ok) throw new Error(d.error||"error");
      bookings=d.bookings||[];
      try{sessionStorage.setItem(KEYNAME,key)}catch(e){}
      loginEl.hidden=true; dashEl.hidden=false;
      render();
      return true;
    }catch(e){ errEl.textContent="Помилка з'єднання"; return false; }
  }

  function bars(el, items, opts){
    opts=opts||{};
    var max=Math.max(1,...items.map(function(i){return i.v}));
    el.innerHTML = items.length? items.map(function(i){
      return '<div class="bar"><span class="bn">'+i.n+'</span><span class="bt"><i style="width:'+(i.v/max*100)+'%"></i></span><span class="bv">'+(opts.money?fmtInt(i.v)+" ₴":fmtInt(i.v))+'</span></div>';
    }).join("") : '<p class="empty">Немає даних</p>';
  }

  function render(){
    var now=new Date(), curMonth=now.toISOString().slice(0,7);
    var real=bookings.filter(function(b){return !b.is_request});
    // clients by phone
    var clients={};
    bookings.forEach(function(b){
      var k=phoneKey(b.phone)||("n"+b.id);
      (clients[k]=clients[k]||{name:b.name,phone:b.phone,visits:0,last:"",services:{}});
      clients[k].visits++;
      var dt=b.date||(b.created_at||"").slice(0,10);
      if(dt>clients[k].last)clients[k].last=dt;
      if(b.name)clients[k].name=b.name;
      if(b.service)clients[k].services[b.service]=1;
    });
    var clientArr=Object.keys(clients).map(function(k){return clients[k]});
    var repeat=clientArr.filter(function(c){return c.visits>=2}).length;
    // revenue this month (midpoint)
    var revMonth=real.reduce(function(s,b){
      var dt=b.date||(b.created_at||"").slice(0,10);
      if(monthKey(dt)!==curMonth) return s;
      var mid = (b.price_min&&b.price_max)?(b.price_min+b.price_max)/2 : (b.price_min||b.price_max||0);
      return s+mid;
    },0);
    var bookMonth=bookings.filter(function(b){var dt=b.date||(b.created_at||"").slice(0,10);return monthKey(dt)===curMonth}).length;

    // KPIs
    $("#kpis").innerHTML=[
      ["Усього записів",fmtInt(bookings.length)],
      ["Цього місяця",fmtInt(bookMonth)],
      ["Клієнтів",fmtInt(clientArr.length)],
      ["Повторних",fmtInt(repeat)],
      ["Виручка / міс *",fmtInt(Math.round(revMonth))+" ₴"],
    ].map(function(k){return '<div class="kpi"><div class="v">'+k[1]+'</div><div class="l">'+k[0]+'</div></div>'}).join("");

    // by month (last 6)
    var months=[];
    for(var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d)}
    bars($("#byMonth"), months.map(function(d){
      var mk=d.toISOString().slice(0,7);
      var c=bookings.filter(function(b){var dt=b.date||(b.created_at||"").slice(0,10);return monthKey(dt)===mk}).length;
      return {n:MONTHS[d.getMonth()]+" "+String(d.getFullYear()).slice(2), v:c};
    }));
    // by weekday
    var dow=[0,0,0,0,0,0,0];
    bookings.forEach(function(b){if(b.date){var d=new Date(b.date+"T00:00");if(!isNaN(d))dow[d.getDay()]++}});
    var dowItems=[1,2,3,4,5,6,0].map(function(i){return {n:DOW[i],v:dow[i]}});
    bars($("#byDow"), dowItems);
    // top services
    bars($("#byService"), topBy(bookings,"service",6));
    // top breeds
    bars($("#byBreed"), topBy(bookings.filter(function(b){return b.breed}),"breed",6));

    // clients table
    clientArr.sort(function(a,b){return b.last<a.last?-1:1});
    renderClients(clientArr);
    $("#clientsCount").textContent="("+clientArr.length+")";
    // recent
    var tb=$("#recentTbl tbody");
    tb.innerHTML = bookings.slice(0,40).map(function(b){
      return "<tr><td class='muted'>"+(b.created_at||"").slice(0,16).replace("T"," ")+"</td><td>"+
        (b.is_request?"<span class='tag'>заявка</span>":(b.date||"—")+" "+(b.time||""))+"</td><td>"+
        esc(b.name)+"</td><td>"+esc(b.phone)+"</td><td>"+esc(b.service)+(b.breed?" · "+esc(b.breed):"")+"</td><td class='muted'>"+
        (b.duration?Math.floor(b.duration/60)+"г "+(b.duration%60?b.duration%60+"хв":""):"")+"</td></tr>";
    }).join("") || '<tr><td colspan="6" class="empty">Ще немає записів</td></tr>';
  }

  var _clients=[];
  function renderClients(arr){
    _clients=arr;
    var q=($("#clientSearch").value||"").toLowerCase().trim();
    var f=arr.filter(function(c){return !q || (c.name||"").toLowerCase().includes(q) || String(c.phone||"").includes(q)});
    $("#clientsTbl tbody").innerHTML = f.length? f.map(function(c){
      return "<tr><td>"+esc(c.name)+"</td><td>"+esc(c.phone)+"</td><td class='num'>"+c.visits+"</td><td>"+
        (c.last||"—")+"</td><td class='muted'>"+Object.keys(c.services).join(", ")+"</td></tr>";
    }).join("") : '<tr><td colspan="5" class="empty">Нічого не знайдено</td></tr>';
  }
  function topBy(list,field,n){
    var m={}; list.forEach(function(b){var v=b[field];if(v)m[v]=(m[v]||0)+1});
    return Object.keys(m).map(function(k){return {n:k,v:m[k]}}).sort(function(a,b){return b.v-a.v}).slice(0,n);
  }
  function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}

  $("#enter").addEventListener("click",function(){load(keyInput.value.trim())});
  keyInput.addEventListener("keydown",function(e){if(e.key==="Enter")load(keyInput.value.trim())});
  $("#refresh").addEventListener("click",function(){load(sessionStorage.getItem(KEYNAME)||"")});
  $("#logout").addEventListener("click",function(){try{sessionStorage.removeItem(KEYNAME)}catch(e){}location.reload()});
  $("#clientSearch").addEventListener("input",function(){renderClients(_clients)});

  var saved=null; try{saved=sessionStorage.getItem(KEYNAME)}catch(e){}
  if(saved) load(saved);
})();
</script>
</body>
</html>
